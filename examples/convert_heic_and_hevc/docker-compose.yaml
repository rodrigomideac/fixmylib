services:
  fixmylib-db:
    image: postgres:14
    networks:
      - fixmylib-network
    ports:
      - "5432:5432"
    volumes:
      - /tmp/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=fixmylib

  fixmylib:
    image: rodrigomideac/fixmylib:latest
    networks:
      - fixmylib-network
    depends_on:
      - fixmylib-db
    environment:
      - DATABASE_URL=postgresql://postgres:fixmylib@fixmylib-db/postgres
    volumes:
      - ./media-out:/media-out
      - ../media-in:/media-in
    devices:
      - /dev/dri:/dev/dri

networks:
  fixmylib-network:
    driver: bridge
